name: Indexer Image

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - ".github/workflows/indexer-image.yml"
      - ".github/workflows/test.yml"
      - "indexer/**"
  pull_request:
    paths:
      - ".github/workflows/indexer-image.yml"
      - ".github/workflows/test.yml"
      - "indexer/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexer-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test.yml

  build:
    name: build indexer image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: indexer
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish indexer image
    needs: test
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-indexer" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=master,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=long,enable=${{ github.ref_type == 'branch' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: publish
        with:
          context: indexer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
