name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Disposable cluster for test/role-check.db.test.ts, which creates and drops roles.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: role-check-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # The server's prebuild copies shared/* and indexer/src/schema-defs.ts
      # into server/src/ at build time. Those copies are gitignored.
      - run: npm run build
      - run: npm test
        env:
          ROLE_CHECK_DATABASE_URL: postgres://postgres:role-check-admin@localhost:5432/postgres
          PROVING_QUERY_DATABASE_URL: postgres://postgres:role-check-admin@localhost:5432/postgres

  indexer:
    name: indexer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
      # Tests load the actual config under both networks and strict-mode failures.
      - run: npm test
      # Typecheck runs mainnet codegen to materialize ponder-env.d.ts, then
      # tsc --noEmit. No DB or RPC is needed; codegen accepts dummy values.
      - run: npm run codegen:calibnet
      - run: npm run typecheck
