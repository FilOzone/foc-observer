services:
  # Optional bridge-only proxy for Lotus processes bound to host loopback. Enable
  # explicitly with `docker compose --profile lotus ...`; remote RPC needs none.
  #
  # LOTUS_PROXY_BIND must be the bridge gateway address that containers use for
  # host.docker.internal. The proxy never listens on every host interface.
  #
  lotus-proxy:
    profiles: ["lotus"]
    image: alpine/socat@sha256:5aa280c6fc5bee94dbd2bbdf2a58d30f50396eaa110be84b03636945b157ae68
    network_mode: host
    environment:
      LOTUS_PROXY_BIND: ${LOTUS_PROXY_BIND:-}
      LOTUS_MAINNET_PORT: ${LOTUS_MAINNET_PORT:-2234}
      LOTUS_CALIBNET_PORT: ${LOTUS_CALIBNET_PORT:-2235}
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$${LOTUS_PROXY_BIND:-}" in "" | "*" | "0.0.0.0" | "::") echo "set LOTUS_PROXY_BIND to a specific bridge gateway address" >&2; exit 1;; esac
        socat "TCP-LISTEN:11234,bind=$${LOTUS_PROXY_BIND},fork,reuseaddr" "TCP:127.0.0.1:$${LOTUS_MAINNET_PORT}" &
        socat "TCP-LISTEN:11235,bind=$${LOTUS_PROXY_BIND},fork,reuseaddr" "TCP:127.0.0.1:$${LOTUS_CALIBNET_PORT}"
    restart: unless-stopped


  postgres-calibnet:
    image: postgres:18
    environment:
      POSTGRES_DB: ponder
      POSTGRES_USER: ponder
      POSTGRES_PASSWORD: ${FOC_DATABASE_OWNER_PASSWORD:?}
    volumes:
      - pgdata-calibnet:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponder"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-mainnet:
    image: postgres:18
    environment:
      POSTGRES_DB: ponder
      POSTGRES_USER: ponder
      POSTGRES_PASSWORD: ${FOC_DATABASE_OWNER_PASSWORD:?}
    volumes:
      - pgdata-mainnet:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponder"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-query-role:
    image: postgres:18
    depends_on:
      postgres-calibnet:
        condition: service_healthy
      postgres-mainnet:
        condition: service_healthy
    environment:
      FOC_DATABASE_OWNER_PASSWORD: ${FOC_DATABASE_OWNER_PASSWORD:?}
      FOC_DATABASE_OWNER_PREVIOUS_PASSWORD: ${FOC_DATABASE_OWNER_PREVIOUS_PASSWORD:-}
      FOC_QUERY_DATABASE_PASSWORD: ${FOC_QUERY_DATABASE_PASSWORD:?}
    volumes:
      - ./postgres/provision.sh:/usr/local/bin/provision:ro
      - ./postgres/bootstrap.sql:/usr/local/share/foc/bootstrap.sql:ro
      - ./postgres/public-relations.sql:/usr/local/share/foc/public-relations.sql:ro
    command: ["/usr/local/bin/provision", "postgres-calibnet", "postgres-mainnet"]
    restart: "no"

  ponder-calibnet:
    build: indexer
    depends_on:
      postgres-calibnet:
        condition: service_healthy
      postgres-query-role:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGPASSWORD: ${FOC_DATABASE_OWNER_PASSWORD:?}
      PONDER_NETWORK: calibnet
      PONDER_STRICT_ENV: "true"
      DATABASE_URL: postgres://ponder@postgres-calibnet:5432/ponder
      RPC_URL: ${CALIBNET_RPC_URL:?}
      PORT: 17827
    # Writes tables to the named schema; auto-creates views in public so the
    # server queries unqualified table names. The active schema name is
    # deployment state, not code: set CALIBNET_DATA_SCHEMA in .env and bump it
    # when reindexing. See REINDEX.md.
    command: ["npm", "start", "--", "--schema", "${CALIBNET_DATA_SCHEMA:-data_v1}", "--views-schema", "public"]
    restart: unless-stopped
    volumes:
      - ./indexer/ponder.schema.ts:/app/ponder.schema.ts
      - ./indexer/src:/app/src
      - ./indexer/abis:/app/abis

  ponder-mainnet:
    build: indexer
    depends_on:
      postgres-mainnet:
        condition: service_healthy
      postgres-query-role:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGPASSWORD: ${FOC_DATABASE_OWNER_PASSWORD:?}
      PONDER_NETWORK: mainnet
      PONDER_STRICT_ENV: "true"
      DATABASE_URL: postgres://ponder@postgres-mainnet:5432/ponder
      RPC_URL: ${MAINNET_RPC_URL:?}
      PORT: 17828
    command: ["npm", "start", "--", "--schema", "${MAINNET_DATA_SCHEMA:-data_v1}", "--views-schema", "public"]
    restart: unless-stopped
    volumes:
      - ./indexer/ponder.schema.ts:/app/ponder.schema.ts
      - ./indexer/src:/app/src
      - ./indexer/abis:/app/abis

  foc-observer:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres-query-role:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loopback by default, for a reverse proxy on this host. A remote proxy needs
    # FOC_SERVER_BIND set to an interface address and a firewall that admits only
    # the proxy; otherwise callers bypass its TLS and rate limits.
    ports:
      - "${FOC_SERVER_BIND:-127.0.0.1}:${FOC_SERVER_PORT:?}:${FOC_SERVER_PORT:?}"
    environment:
      FOC_SERVER_PORT: ${FOC_SERVER_PORT:?}
      FOC_API_URL: ${FOC_API_URL:?}
      PGPASSWORD: ${FOC_QUERY_DATABASE_PASSWORD:?}
      FOC_CALIBNET_QUERY_DATABASE_URL: postgres://foc_observer_query@postgres-calibnet:5432/ponder
      FOC_CALIBNET_RPC_URL: ${CALIBNET_RPC_URL:?}
      FOC_MAINNET_QUERY_DATABASE_URL: postgres://foc_observer_query@postgres-mainnet:5432/ponder
      FOC_MAINNET_RPC_URL: ${MAINNET_RPC_URL:?}
      BETTERSTACK_CH_USER: ${BETTERSTACK_CH_USER:-}
      BETTERSTACK_CH_PASSWORD: ${BETTERSTACK_CH_PASSWORD:-}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata-calibnet:
    name: ponder_pgdata-calibnet
    external: true
  pgdata-mainnet:
    name: ponder_pgdata-mainnet
    external: true
